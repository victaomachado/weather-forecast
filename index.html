<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="src/styles/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  </head>
  <body>

    <div id="container">
      <form id="search">
        <i class="fa-solid fa-location-dot"></i>
        <input
          type="search"
          name="city-name"
          id="city-name"
          placeholder="Buscar cidade"
        />
        <button>
          <i
            class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>

      <div id="weather">
        <h1 id="title">
          Rolante, BR
        </h1>
        <div id="infos">
          <div id="temp">
            <img
              id="temp-img"
              src="http://openweathermap.org/img/wn/04d@2x.png"
              alt="Weather Image"
            />
            <div>
              <p id="temp-value">
                32˚C
              </p>
              <p id="temp-description">
                Ensolarado
              </p>
            </div>
          </div>

          <div id="other-infos">

            <div id="info">
              <i id="temp-max-icon" class="fa-solid fa-temperature-high"></i>
              <div>
                <h2>Temp. max</h2>
                <p id="temp-max">
                  32˚C
                </p>
              </div>
            </div>

            <div id="info">
              <i id="temp-min-icon" class="fa-solid fa-temperature-low"></i>

              <div>
                <h2>Temp. min</h2>
                <p id="temp-min">
                  12˚C
                </p>
              </div>

            </div>

            <div id="info">
              <i id="humidity-icon" class="fa-solid fa-droplet"></i>

              <div>
                <h2>Umidade</h2>
                <p id="humidity">
                  50%
                </p>
              </div>
            </div>

            <div id="info">
              <i id="wind-icon" class="fa-solid fa-wind"></i>

              <div>
                <h2>Vento</h2>
                <p id="wind">
                  50 Km/h
                </p>
              </div>
            </div>

          </div>

        </div>
      </div>

      <div id="alert">

      </div>
    </div>

    <script src="src/javascript/script.js"></script>
  </body>
</html>
